schema: spec-driven

context: |
  Project: "AI-Augmented Digital Brain" (llm-brain) — MSc Software thesis MVP.
  Goal: a multi-tenant personal LLM/OS emulating a Brain-LLM symbiosis for infinite
  memory, personal knowledge management (PKM), advanced reasoning and decision support.

  Authors: Pedro David Rodas Mantilla, Giovanny Daniel Jacome Cajamarca.
  Tutor: Ing. Rodolfo Bojorque, PhD. Institution: UPS.

  Scope is an MVP (~120h per student, ~8 weeks) covering 9 objectives/modules:
    1. Architecture & repo (C4 docs, MCP diagram, OSS stack, CI).
    2. One-Tap Memory Distillation: Python ETL with LangChain out-of-the-box loaders (any
       file type) -> content reasoned by Qwen3.5-4B -> JSON triples + metadata; >=100 items.
    3. Hybrid store + RAG: MongoDB (docs/binaries via GridFS, local container) + Chroma
       (2048-dim multimodal embeddings via Qwen3-VL-Embedding-2B); LangChain Top-k retrieval.
    4. LLM: single multimodal Qwen3.5-4B — LOCAL host process (LLM_BACKEND=qwen_local|ollama)
      serves **base** model
       (Premium cloud + RAG). On-device: Free = base quantized; Premium = fine-tuned
       quantized (React Native / Neural Engine / Metal). Local LoRA fine-tuning feeds
       Premium on-device only.
    5. Symbiotic Learning Loop: LangGraph + MCP agents Ingestor / Razonador /
       Evaluador; manual incremental fine-tuning batches. LangChain stays in RAG.
    6. Decision-Support Simulator: deterministic what-if, 3-5 scenarios w/ explicit
       traceable assumptions.
    7. User Interface: Encefalus web app. Analytics is one screen, with two interactive correlations (sleep/productivity, meetings/focus).
    8. Privacy & Scam Shield: phishing/scam detection via heuristics + embedding similarity.
    9. Alpha validation: pytest, FastAPI+Mongo integration, KPIs (mean latency, RAG Top-3
       precision), video demo.

  Tech stack (OSS, ~$0 budget; LOCAL-ONLY MVP — AWS is future work, not in scope):
    - Backend: Python 3.13, FastAPI, LangChain (loaders + RAG), LangGraph (agents).
    - Frontend: React (web); React Native (iPhone) + Neural Engine / Metal
      (mobile, on-device LLM).
    - Parsers: LangChain document loaders out-of-the-box (any format, incl. OCR/video).
    - Data: MongoDB (local Docker, GridFS for binaries), Chroma (local Docker, 2048-dim).
    - LLM: single multimodal Qwen3.5-4B (text/image/video).
      Cloud = local host process on port 8003 with **base** Qwen3.5-4B (not fine-tuned;
      Premium + RAG). Runtime per machine: qwen_local (torch/Metal) or ollama (Linux/Windows).
      On-device Free = **base** Qwen3.5-4B quantized (Q4) in React Native on iPhone via
      Neural Engine / Metal — out of the box, no fine-tuning, no cloud access.
      On-device Premium = **fine-tuned** Qwen3.5-4B quantized (Q4) in React Native, plus
      cloud base + RAG + files + web dashboard.
    - Embeddings: Qwen3-VL-Embedding-2B (2048-dim, multimodal, Matryoshka-truncatable).
    - Infra: Docker Compose, GitHub Actions CI. (AWS ECS Fargate + API Gateway = future.)
    - Fine-tuning: LOCAL LoRA (PEFT / ms-swift / Unsloth) over Qwen3.5-4B — output is the
      **Premium on-device** build only (the cloud host process stays base).
    - Inference: local Qwen3.5-4B base host process (Premium cloud) / on-device React Native
      (Free = base; Premium = fine-tuned).

  Subscription profiles (multi-tenant):
    - Free: Qwen3.5-4B base quantized on-device in React Native (iPhone Neural Engine /
      Metal); no fine-tuning; no cloud access; no context, no files.
    - Premium: fine-tuned Qwen3.5-4B on-device + cloud base Qwen3.5-4B (host process, not
      fine-tuned) + RAG, files, web dashboard.
    - Each user authenticates (JWT + bcrypt) and has isolated data (user_id).

  Frames ↔ Thesis objectives mapping:
    Each frame covers one or more "Objetivos Específicos" from the thesis plan.
    The thesis objectives are preserved as academic reference; frames are the technical execution.

  Constraints & non-goals (out of MVP scope): social sharing between users, multilingual UI,
  voice assistants, live audio/video, AES-at-rest, GDPR, OAuth federado, zero-knowledge cloud,
  real-time auto-retraining, HA/sharding/millions of docs, Monte Carlo/stochastic sims,
  supervised full-scale fraud models, external audits/ISO certs.

  Conventions: conventional commits; GitHub Flow (main + feature branches); pin OSS
  versions in requirements.txt; keep a Markdown experiment log for every fine-tune
  (dataset, hyperparams, metrics); English UI, Spanish document support.

  Truth hierarchy (in case of conflict):
    1. context.txt — Absolute truth. Defines scope, limits, and rules.
    2. Frame 1 outputs — Architecture base, C4 diagrams, backend code.
    3. openspec/config.yaml — Execution order and dependencies.
    4. Frame files (proposal, design, tasks, specs) — Align with context.txt.

  Output convention per frame:
    Each frame has an output/ directory with:
    - output/diagrams/ — Architecture base + data flow diagrams (.drawio)
    - output/documents/ — Justifications, component explanations, design patterns & SOLID

# Per-artifact rules
rules:
  proposal:
    - Always include "Context from Frame X" section citing dependency outputs
    - Always include "Output" section with directory structure
    - Include "Capabilities" section (New + Modified)
    - Include "Execution Order" section
  design:
    - Always include "Design Patterns & SOLID Principles" section
    - Document all patterns used with table (Pattern | Where | Purpose)
    - Document all SOLID principles applied with table (Principle | Application)
    - Include "Data Flow" section with ASCII diagram
  tasks:
    - Break tasks into chunks of max 2 hours
    - Always include Section F: Documentation (output/documents/)
    - Reference output directory in task descriptions
  specs:
    - Use Given/When/Then scenario format
    - Include "MODIFIED Requirements" section for changes to existing frames

# Per-operation guidance
operations:
  apply:
    guidance:
      - Validate XML of all .drawio files before marking complete
      - Run xmllint on diagrams to catch syntax errors
      - Check that output/ structure matches proposal.md Output section
  archive:
    guidance:
      - Summarize the archive outcome before finishing
      - Verify all tasks in tasks.md are checked
      - Ensure spec.md requirements have matching test coverage

# Frames by execution order
# Each frame maps to a directory under openspec/changes/
# anteproyecto_objectives: which thesis "Objetivos Específicos" this frame covers
# Output convention: each frame has output/diagrams/ and output/documents/
frames:
  frame-1:
    directory: objective-1-0-architecture-repo
    title: "Architecture & Repository Foundation"
    description: "C4 docs, MCP diagram, OSS stack, CI, JWT auth, user data model, config, LLM provider protocol, FastAPI skeleton"
    anteproyecto_objectives:
      - "Objetivo Específico 1 (Architecture)"
      - "Objetivo Específico 9 (CI/test infrastructure)"
    depends_on: []
    execution_order: 1
    output:
      diagrams:
        - c4-context.drawio
        - c4-container.drawio
        - c4-component-api.drawio
        - deployment.drawio

  frame-1-1:
    directory: objective-1-1-api-router
    title: "API Router (Gateway)"
    description: "FastAPI router with JWT auth, correlation ID, Kafka integration, task status polling"
    anteproyecto_objectives:
      - "Objetivo Específico 1 (Architecture - API Router)"
    depends_on: ["frame-1"]
    execution_order: 2
    output:
      diagrams:
        - api-router-architecture.drawio
        - api-router-dataflow.drawio
      documents:
        - justificacion-ejemplo.md

  frame-4:
    directory: objective-4-llm-inference-finetuning
    title: "LLM Inference (local Qwen3.5-4B) + Fine-Tuning Services"
    description: "Multimodal LLM inference service (port 8003, host process with LLM_BACKEND=qwen_local|ollama) serving **base** Qwen3.5-4B (Premium cloud + RAG), and local LoRA fine-tuning service (port 8004) that produces the **Premium on-device** build. Free on-device = base quantized (Frame 10). Built BEFORE Frame 2 so ETL can call the base model."
    anteproyecto_objectives:
      - "Objetivo Específico 4 (LLM principal)"
    depends_on: ["frame-1-1"]
    execution_order: 3
    services:
      - name: llm-service
        directory: services/llm
        port: 8003
      - name: finetune-service
        directory: services/finetune
        port: 8004

  frame-2:
    directory: objective-2-memory-distillation
    title: "One-Tap Memory Distillation"
    description: "Python ETL with LangChain out-of-the-box loaders (any file) -> content reasoned by Qwen3.5-4B -> JSON triples + metadata; >=100 items. ETL calls the LLM Service (Frame 4) base model for extraction."
    anteproyecto_objectives:
      - "Objetivo Específico 2 (ETL pipeline)"
    depends_on: ["frame-1-1", "frame-4"]
    execution_order: 4
    parallel_with: ["frame-3"]
    output:
      diagrams:
        - etl-architecture.drawio
        - etl-dataflow.drawio
      documents:
        - justificacion-ejemplo.md

  frame-3:
    directory: objective-3-hybrid-store-rag
    title: "Hybrid Store + RAG"
    description: "MongoDB (docs/binaries via GridFS, local) + Chroma (2048-dim multimodal embeddings via Qwen3-VL-Embedding-2B); LangChain Top-k cross-modal retrieval"
    anteproyecto_objectives:
      - "Objetivo Específico 3 (Hybrid store)"
    depends_on: ["frame-1-1"]
    execution_order: 4
    parallel_with: ["frame-2"]
    output:
      diagrams:
        - rag-architecture.drawio
        - rag-dataflow.drawio
      documents:
        - justificacion-ejemplo.md

  frame-5:
    directory: objective-5-symbiotic-learning
    title: "Symbiotic Learning Loop (MCP Agents)"
    description: "Agents Service (port 8006): LangGraph + MCP agents Ingestor / Razonador / Evaluador; weekly batches; manual fine-tune trigger"
    anteproyecto_objectives:
      - "Objetivo Específico 5 (Learning loop)"
    depends_on: ["frame-2", "frame-3", "frame-4"]
    execution_order: 5
    output:
      diagrams:
        - agents-architecture.drawio
        - agents-dataflow.drawio
      documents:
        - justificacion-ejemplo.md

  frame-6:
    directory: objective-6-decision-support
    title: "Decision-Support Simulator"
    description: "Deterministic what-if analysis, 3-5 scenarios with explicit traceable assumptions"
    anteproyecto_objectives:
      - "Objetivo Específico 6 (Decision support)"
    depends_on: ["frame-1", "frame-3"]
    execution_order: 5
    parallel_with: ["frame-8"]

  frame-7:
    directory: objective-7-user-interface
    title: "User Interface"
    description: "Encefalus web app. Each product screen is built from the API Router. Analytics is the correlations screen (sleep/productivity, meetings/focus)."
    anteproyecto_objectives:
      - "Objetivo Específico 7 (User interface)"
    depends_on: ["frame-6", "frame-8"]
    execution_order: 7

  frame-8:
    directory: objective-8-privacy-shield
    title: "Privacy & Scam Shield"
    description: "Phishing/scam detection via heuristics + embedding similarity; alert system"
    anteproyecto_objectives:
      - "Objetivo Específico 8 (Privacy shield)"
    depends_on: ["frame-1", "frame-3"]
    execution_order: 5
    parallel_with: ["frame-6"]

  frame-9:
    directory: objective-9-alpha-validation
    title: "Alpha Validation + KPIs + Demo"
    description: "KPI measurement (latency, RAG Top-3 precision), video demo"
    anteproyecto_objectives:
      - "Objetivo Específico 9 (Validation)"
    depends_on: ["frame-1", "frame-2", "frame-3", "frame-4", "frame-5", "frame-6", "frame-7", "frame-8", "frame-10"]
    execution_order: 9

  frame-10:
    directory: objective-10-mobile-app
    title: "Mobile App (React Native)"
    description: "React Native iPhone app with auth, navigation, and on-device Qwen3.5-4B via Neural Engine / Metal — Free uses base (out of the box); Premium uses fine-tuned on-device plus cloud base host process"
    anteproyecto_objectives:
      - "Objetivo Específico 1 (mobile foundation)"
      - "Objetivo Específico 4 (Qwen3.5-4B on-device via React Native / Neural Engine / Metal)"
    depends_on: ["frame-4"]
    execution_order: 8
