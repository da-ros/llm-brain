[tool.ruff]
target-version = "py313"
line-length = 100
extend-exclude = [".venv"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "A",    # flake8-builtins
    "C4",   # flake8-comprehensions
    "SIM",  # flake8-simplify
    "TCH",  # flake8-type-checking
    "RUF",  # Ruff-specific rules
]
ignore = [
    "E501",   # line too long (handled by formatter)
    "B008",   # function call in default argument (FastAPI Depends)
]

[tool.ruff.lint.isort]
known-first-party = ["apps", "services"]

[tool.ruff.lint.per-file-ignores]
# Hyphenated Docker service directory; imports inside the image are top-level.
"services/api-router/**" = ["N999"]
"services/api-router/test_api_router.py" = ["E402"]
"services/api-router/conftest.py" = ["E402"]
"services/llm/test_llm.py" = ["E402"]
"services/llm/conftest.py" = ["E402"]
"services/finetune/test_finetune.py" = ["E402"]
"services/finetune/conftest.py" = ["E402"]
"services/etl/test_etl.py" = ["E402"]
"services/etl/conftest.py" = ["E402"]
"services/rag/test_rag.py" = ["E402"]
"services/rag/conftest.py" = ["E402"]
"services/agents/test_agents.py" = ["E402"]
"services/agents/conftest.py" = ["E402"]
"services/simulator/test_simulator.py" = ["E402"]
"services/simulator/test_integration.py" = ["E402"]
"services/simulator/conftest.py" = ["E402"]
"services/shield/test_shield.py" = ["E402"]
"services/shield/conftest.py" = ["E402"]
"services/analytics/test_analytics.py" = ["E402"]
"services/analytics/conftest.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.pytest.ini_options]
testpaths = ["services"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["services"]
omit = ["*/test_*", "notebooks/*"]

[tool.coverage.report]
show_missing = true
fail_under = 80
