services:
  # Frame 1 foundation image (apps.api). Use:
  #   docker compose --profile foundation up api mongo chroma
  # Default `up` still starts api-router on :8000 (Frame 1.1 gateway).
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-local-dev-secret-not-for-production}
      - LLM_PROVIDER=qwen_local
      - LLM_MODEL=Qwen3.5-4B
      - LLM_SERVICE_URL=http://llm-service:8003
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DB=llm_brain
    volumes:
      - ./.env:/app/.env
    depends_on:
      - mongo
      - chroma
    profiles:
      - foundation
    restart: unless-stopped

  api-router:
    build: ./services/api-router
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DB=llm_brain
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-me-in-production}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRATION_MINUTES=60
      - FERNET_KEY=${FERNET_KEY:-change-me-in-production}
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    depends_on:
      - mongo
      - kafka
    restart: unless-stopped

  llm-service:
    build: ./services/llm
    ports:
      - "8003:8003"
    environment:
      - LLM_PROVIDER=${LLM_PROVIDER:-qwen_local}
      - LLM_MODEL=${LLM_MODEL:-Qwen3.5-4B}
      # Frame 1 contract: Qwen3.5-4B base container. Frame 4 still ships a Bedrock
      # client; those keys are unused by apps/api.
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID:-meta.llama3-8b-instruct-v1:0}
    restart: unless-stopped

  finetune-service:
    build: ./services/finetune
    ports:
      - "8004:8004"
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID:-}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY:-}
      - AWS_REGION=${AWS_REGION:-us-east-1}
      - BEDROCK_MODEL_ID=${BEDROCK_MODEL_ID:-meta.llama3-8b-instruct-v1:0}
    restart: unless-stopped

  etl-service:
    build: ./services/etl
    ports:
      - "8001:8001"
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DB=llm_brain
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    depends_on:
      - mongo
      - kafka
    restart: unless-stopped

  rag-service:
    build: ./services/rag
    ports:
      - "8002:8002"
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DB=llm_brain
      - CHROMA_PERSIST_DIR=/app/data/chroma
      - FERNET_KEY=${FERNET_KEY:-change-me-in-production}
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    depends_on:
      - mongo
      - chroma
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8005:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

volumes:
  mongo_data:
  chroma_data:
  kafka_data:
