services:
  api-router:
    build: ./services/api-router
    ports:
      - "8000:8000"
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DB=llm_brain
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_ENABLED=true
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-local-dev-secret-not-for-production}
      - JWT_ALGORITHM=HS256
      - JWT_EXPIRATION_MINUTES=60
      - RAG_SERVICE_URL=http://rag-service:8002
      - LLM_SERVICE_URL=http://llm-service:8003
      - ETL_SERVICE_URL=http://etl-service:8001
      - AGENTS_SERVICE_URL=http://agents-service:8006
      - SIMULATOR_SERVICE_URL=http://simulator-service:8007
      - SHIELD_SERVICE_URL=http://shield-service:8009
      - RATE_LIMIT_SIMULATE=10
      - RATE_LIMIT_SHIELD_SCAN=30
      - CHAT_VIA_AGENTS=true
      - KAFKA_TOPIC_SESSION_TURN=session.turn.completed
      - MAX_RETRIES=3
      - TASK_STATUS_TTL_DAYS=30
      - FERNET_KEY=${FERNET_KEY:-change-me-in-production}
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    depends_on:
      - mongo
      - kafka
      - rag-service
      - agents-service
      - simulator-service
      - shield-service
    restart: unless-stopped

  llm-service:
    build: ./services/llm
    ports:
      - "8003:8003"
    environment:
      - QWEN_MODEL_ID=${QWEN_MODEL_ID:-qwen3.5-4b}
      - QWEN_HF_MODEL_ID=${QWEN_HF_MODEL_ID:-Qwen/Qwen3.5-4B}
      - QWEN_MOCK=${QWEN_MOCK:-true}
      - INFERENCE_TIMEOUT_SECONDS=${INFERENCE_TIMEOUT_SECONDS:-30}
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  finetune-service:
    build: ./services/finetune
    ports:
      - "8004:8004"
    environment:
      - BASE_MODEL_ID=${BASE_MODEL_ID:-qwen3.5-4b}
      - LORA_BACKEND=${LORA_BACKEND:-peft}
      - LORA_MOCK=${LORA_MOCK:-true}
      - TRAINING_EPOCHS=${TRAINING_EPOCHS:-5}
      - TRAINING_LR=${TRAINING_LR:-0.001}
      - MAX_TRAINING_TIME_HOURS=${MAX_TRAINING_TIME_HOURS:-2}
      - ADAPTER_OUTPUT_DIR=/app/data/models
      - TRAINING_LOG_DIR=/app/data/training_logs
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  etl-service:
    build: ./services/etl
    ports:
      - "8001:8001"
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DB=llm_brain
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_ENABLED=true
      - LLM_SERVICE_URL=http://llm-service:8003
      - TRIPLES_OUTPUT_DIR=/app/data/triples
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    depends_on:
      - mongo
      - kafka
      - llm-service
    restart: unless-stopped

  agents-service:
    build: ./services/agents
    ports:
      - "8006:8006"
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DB=llm_brain
      - KAFKA_BOOTSTRAP_SERVERS=kafka:9092
      - KAFKA_ENABLED=true
      - RAG_SERVICE_URL=http://rag-service:8002
      - LLM_SERVICE_URL=http://llm-service:8003
      - FINETUNE_SERVICE_URL=http://finetune-service:8004
      - SIMULATOR_SERVICE_URL=http://simulator-service:8007
      - SHIELD_SERVICE_URL=http://shield-service:8009
      - KAFKA_TOPIC_SESSION_TURN=session.turn.completed
      - EVAL_SCORE_THRESHOLD=0.6
      - BATCH_MIN_ITEMS=10
      - BATCH_EXPORT_DIR=/app/data/finetune_batches
      - AGENTS_STORE=mongo
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    depends_on:
      - mongo
      - kafka
      - rag-service
      - llm-service
      - finetune-service
      - simulator-service
      - shield-service
    restart: unless-stopped

  simulator-service:
    build: ./services/simulator
    ports:
      - "8007:8007"
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DB=llm_brain
      - RAG_SERVICE_URL=http://rag-service:8002
      - LLM_SERVICE_URL=http://llm-service:8003
      - LLM_TEMPERATURE=0
      - DEFAULT_SLEEP_HOURS=7
      - DEFAULT_MEETING_HOURS=3
      - DEFAULT_FOCUS_HOURS=4
    depends_on:
      - mongo
      - rag-service
      - llm-service
    restart: unless-stopped

  shield-service:
    build: ./services/shield
    ports:
      - "8009:8009"
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DB=llm_brain
      - RAG_SERVICE_URL=http://rag-service:8002
      - LLM_SERVICE_URL=http://llm-service:8003
      - LLM_TEMPERATURE=0
      - SIMILARITY_THRESHOLD=0.80
      - MAX_UPLOAD_BYTES=20971520
      - CORPUS_PATH=/app/data/shield/corpus.jsonl
    volumes:
      - ./data:/app/data
    depends_on:
      - mongo
      - rag-service
      - llm-service
    restart: unless-stopped

  rag-service:
    build: ./services/rag
    ports:
      - "8002:8002"
    environment:
      - MONGODB_URI=mongodb://mongo:27017
      - MONGODB_DB=llm_brain
      - CHROMA_HOST=chroma
      - CHROMA_PORT=8000
      - VECTOR_STORE_PROVIDER=chroma
      - EMBEDDING_MODEL=Qwen/Qwen3-VL-Embedding-2B
      - EMBEDDING_DIM=2048
      - EMBEDDING_MOCK=${EMBEDDING_MOCK:-true}
      - RAG_TOP_K=3
      - RAG_CHUNK_SIZE=1000
      - RAG_CHUNK_OVERLAP=200
      - FERNET_KEY=${FERNET_KEY:-change-me-in-production}
    volumes:
      - ./data:/app/data
      - ./.env:/app/.env
    depends_on:
      - mongo
      - chroma
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    restart: unless-stopped

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:latest
    ports:
      - "8005:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

volumes:
  mongo_data:
  chroma_data:
  kafka_data:
