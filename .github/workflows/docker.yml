name: Docker Build & Scan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-scan:
    name: Build Images → Snyk Image Scan
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service:
          - api-router
          - etl
          - rag
          - llm
          - finetune
          - agents
          - simulator
          - shield
    steps:
      - uses: actions/checkout@v7

      - name: Build Docker image
        run: docker build -t llm-brain/${{ matrix.service }}:latest ./services/${{ matrix.service }}

      - uses: snyk/actions/setup@master
      - name: Run Snyk container scan
        run: snyk container test llm-brain/${{ matrix.service }}:latest --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
