name: Docker Build & Scan

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-scan:
    name: Build Images → Snyk Image Scan
    runs-on: ubuntu-latest
    strategy:
      # One failing scan must not cancel the rest — every image reports.
      fail-fast: false
      matrix:
        include:
          - service: api-router
            path: ./services/api-router
          - service: etl
            path: ./services/etl
          - service: rag
            path: ./services/rag
          - service: finetune
            path: ./services/finetune
          - service: agents
            path: ./services/agents
          - service: simulator
            path: ./services/simulator
          - service: shield
            path: ./services/shield
          - service: analytics
            path: ./services/analytics
          - service: web
            path: ./apps/web
    steps:
      - uses: actions/checkout@v7

      # Free ~25-30 GB on the runner: etl (torch + unstructured + apt) needs
      # more space than ubuntu-latest ships with; the preinstalled Android
      # SDK, .NET, GHC and CodeQL toolchains are unused by these builds.
      - name: Free runner disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /opt/hostedtoolcache/CodeQL 2>/dev/null || true
          sudo docker image prune -af >/dev/null 2>&1 || true
          df -h /

      - name: Build Docker image
        run: docker build -t llm-brain/${{ matrix.service }}:latest ${{ matrix.path }}

      - uses: snyk/actions/setup@master
      - name: Run Snyk container scan
        run: snyk container test llm-brain/${{ matrix.service }}:latest --severity-threshold=high --policy-path=.snyk
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
