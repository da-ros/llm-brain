name: CI

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

jobs:
  pipeline:
    name: Lint → Test → Snyk Code
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --eval 'db.runCommand({ ping: 1 })'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      chroma:
        image: chromadb/chroma:latest
        ports:
          - 8001:8000
    steps:
      # ── 0. Quick setup (lint only needs ruff) ─────────────
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install linter
        run: pip install ruff

      # ── 1. Lint & Format (fast gate, runs while services boot) ─
      - name: Run ruff lint
        run: ruff check .
      - name: Run ruff format check
        run: ruff format --check .

      # ── 2. Heavy dependencies + services are now ready ─────
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libmagic1
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          for svc in services/*/requirements.txt; do pip install -r "$svc" 2>/dev/null || true; done
          pip install pytest pytest-asyncio pytest-cov

      # ── 3. Tests + Coverage (services are healthy by now) ───
      - name: Run tests with coverage
        run: pytest --cov --cov-report=term-missing
        env:
          MONGODB_URI: mongodb://localhost:27017
          MONGODB_DB: llm_brain_test
          CHROMA_PERSIST_DIR: ./data/chroma_test
          JWT_SECRET_KEY: test-secret
          JWT_ALGORITHM: HS256
          JWT_EXPIRATION_MINUTES: 60
          FERNET_KEY: QmSFavzoGj9MohzGATx3CnkOR2I9JTP4ueRhP4P4DZ0=
          LLM_PROVIDER: local
          LLM_SERVICE_URL: http://localhost:8003
          LLM_MODEL: Qwen3.5-4B
          EMBEDDING_MOCK: "true"
          CHROMA_HOST: localhost
          CHROMA_PORT: "8001"
          KAFKA_ENABLED: "false"

      # ── 4. Security Scan (Snyk Code / SAST) ───────────────
      - uses: snyk/actions/setup@master
      - name: Run Snyk dependency scan
        run: snyk test --all-projects --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      - name: Run Snyk SAST
        run: snyk code test --severity-threshold=high
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
